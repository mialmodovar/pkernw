<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover, or env(safe-area-inset-*) reports zero and every
         rule written against it quietly does nothing. .pb-safe in index.css is
         the one that matters: without the inset it collapses to its 4px floor,
         and the phone's action band — the row with Fold and Call on it — sits
         under the home indicator on every iPhone since the X. That band is the
         only reason .pb-safe was written. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Paints the browser chrome to match the table on mobile, so the app does
         not sit in a white frame before the felt loads. -->
    <meta name="theme-color" content="#0c0708" />
    <title>HomeGame</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
