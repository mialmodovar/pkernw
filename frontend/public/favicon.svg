<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HomeGame">
  <!-- A chip in the table's own colours: the deep red of the chrome, the gold of
       the highlight, a bone-white face. Flat shapes and no filters, because the
       size this is actually read at is 16 pixels in a tab. -->
  <title>HomeGame</title>

  <!-- Body. Dark enough to hold its shape against a pale tab strip, light
       enough not to disappear into a dark one. -->
  <circle cx="32" cy="32" r="31" fill="#7a1826" />
  <circle cx="32" cy="32" r="31" fill="none" stroke="#4a0f17" stroke-width="2" />

  <!-- The six edge spots, drawn as one dashed ring rather than six shapes.
       Circumference at r=27 is ~169.6, so 6 x (13 + 15.27) closes exactly. -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#d4af36" stroke-width="7"
          stroke-dasharray="13 15.27" stroke-dashoffset="6.5" />

  <!-- The face, with a thin gold rim to separate it from the body. -->
  <circle cx="32" cy="32" r="19.5" fill="#c8a227" />
  <circle cx="32" cy="32" r="18.5" fill="#f4ece8" />

  <!-- A spade, built from a triangle and two lobes over a stem: overlapping
       shapes in one colour read as a single silhouette at any size, which a
       single clever path does not always do once the browser scales it down. -->
  <g fill="#7a1826">
    <path d="M32 16.5 L19.5 33 L44.5 33 Z" />
    <circle cx="24.5" cy="34.6" r="8.1" />
    <circle cx="39.5" cy="34.6" r="8.1" />
    <path d="M29.2 37.5 C30.5 42.8 28.3 46.6 26 48.3 h12 C35.7 46.6 33.5 42.8 34.8 37.5 Z" />
  </g>
</svg>
